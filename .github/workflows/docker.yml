name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  pull_request:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test (${{ matrix.app }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: "packagist"
            smoke: "php -v && composer --version && test -f /srv/app/config/parameters.yml.dist"
          - app: "solr"
            smoke: "java -version && test -f /opt/solr/server/solr/configsets/data_driven_schema_configs/conf/managed-schema"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Validate compose file"
        run: "docker compose config"

      - name: "Build image for testing"
        uses: docker/build-push-action@v6
        with:
          context: "${{ matrix.app }}"
          load: true
          tags: "dockette/packagist:${{ matrix.app }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Smoke test image"
        run: "docker run --rm dockette/packagist:${{ matrix.app }} sh -lc '${{ matrix.smoke }}'"

  build:
    name: "Build (${{ matrix.app }})"
    needs: ["test"]
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: "packagist"
          - app: "solr"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Login to DockerHub"
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build and push"
        uses: docker/build-push-action@v6
        with:
          context: "${{ matrix.app }}"
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: "dockette/packagist:${{ matrix.app }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: "linux/amd64,linux/arm64"

  docs:
    name: "Docs"
    runs-on: "ubuntu-latest"
    needs: ["build"]
    if: github.ref == 'refs/heads/master'

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Update Docker Hub description"
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: "dockette/packagist"
